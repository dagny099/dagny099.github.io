excluded_candidates:
  - source_path: _pages/digital-twin-graphrag-reference.html
    source_type: page
    reason: "substantive but extremely large and heavily HTML/data-table driven; better candidate for Release 2 once table normalization is designed."
  - source_path: _pages/digital-twin_compare_llms.html
    source_type: page
    reason: "substantive but overlaps the selected Digital Twin evaluation article and is highly HTML-specific."
  - source_path: _pages/ai-pulse-q2-2026-companion.html
    source_type: page
    reason: "strong article but outside the first release's tighter emphasis on Barbara's own systems and reusable evaluation patterns."
  - source_path: _projects/job-application-assistant.md
    source_type: project
    reason: "public project, but superseded by stronger current AI-system examples for Release 1."
  - source_path: _projects/midjourney-tracker-browser-extension.md
    source_type: project
    reason: "public project, but less central to RAG, knowledge graphs, evaluation, or knowledge legibility."
  - source_path: data-stories/citation-link-prediction.md
    source_type: data_story
    reason: "strong graph/ML story; deferred to keep article count within target and avoid over-weighting project-style narratives."
  - source_path: data-stories/hive-photo-metadata-tracker.md
    source_type: data_story
    reason: "substantially overlaps selected Beehive project page and Bees/Graphs/Governance essay."
  - source_path: data-stories/converting-textual-to-visual-timeline.md
    source_type: data_story
    reason: "unpublished/draft."
  - source_path: _posts/2022-09-16-diy-stock-ticker-to-learn-python-frameworks.md
    source_type: post
    reason: "unpublished."
  - source_path: _resources/resource-schema-org-cheatsheet-builders.md
