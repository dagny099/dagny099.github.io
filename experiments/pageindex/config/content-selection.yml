corpus:
  title: "Barbara Hidalgo-Sotelo Website Corpus"
  version: "site-book-v1"
  purpose: "Derived experimental Markdown corpus for PageIndex hierarchy and navigation experiments."
  original_authority: "The original website source files remain authoritative."

expected_counts:
  core_pages:
    min: 4
    max: 4
  projects:
    min: 4
    max: 6
  articles:
    min: 6
    max: 10
  resources:
    min: 1
    max: 8

