<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="t d">
  <title id="t">Your toolkit, in layers</title>
  <desc id="d">Global tools (Homebrew, Poetry, direnv, Git, JupyterLab, and the direnv shell hook) are installed once on your machine. Each project folder holds its own .venv, pyproject.toml, poetry.lock, .envrc and .env, plus a Jupyter kernel that points at its .venv. As you cd between folders, direnv switches your shell from the global python3 to each project's own environment.</desc>
  <defs>
    <style>
      .serif { font-family: 'EB Garamond', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      .mono  { font-family: 'IBM Plex Mono', Menlo, Consolas, monospace; }
      .eyebrow { font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
      .muted { fill: #5b6670; }
      .ink   { fill: #1f2933; }
    </style>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f5e55"/>
    </marker>
    <marker id="coral-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b9411f"/>
    </marker>
  </defs>

  <rect width="1200" height="920" fill="#f8f4ec"/>

  <!-- Header -->
  <text x="60" y="92" class="serif" font-size="52" font-weight="600" fill="#b9411f">Your toolkit, in layers</text>
  <text x="60" y="132" class="sans muted" font-size="19">Tools live on your machine. Everything a project needs lives in its folder.</text>
  <text x="60" y="158" class="sans muted" font-size="19">direnv switches between them every time you cd.</text>
  <line x1="60" y1="186" x2="1140" y2="186" stroke="#e2d9c9" stroke-width="1.5"/>

  <!-- Layer 1: your machine -->
  <rect x="60" y="210" width="1080" height="150" rx="14" fill="#fbf8f2" stroke="#a2988b" stroke-width="2"/>
  <text x="1110" y="246" class="eyebrow" fill="#7a6f62" text-anchor="end">INSTALL ONCE</text>
  <text x="92" y="252" class="serif" font-size="32" font-weight="600" fill="#5f554a">Your machine</text>
  <text x="92" y="284" class="sans muted" font-size="17">Global tools. They never go inside a project's environment.</text>
  <g class="sans" font-size="16" fill="#4a4238" text-anchor="middle">
    <rect x="92"  y="304" width="120" height="34" rx="8" fill="#ebe4d8"/><text x="152" y="327">Homebrew</text>
    <rect x="226" y="304" width="96"  height="34" rx="8" fill="#ebe4d8"/><text x="274" y="327">Poetry</text>
    <rect x="336" y="304" width="96"  height="34" rx="8" fill="#ebe4d8"/><text x="384" y="327">direnv</text>
    <rect x="446" y="304" width="66"  height="34" rx="8" fill="#ebe4d8"/><text x="479" y="327">Git</text>
    <rect x="526" y="304" width="128" height="34" rx="8" fill="#ebe4d8"/><text x="590" y="327">JupyterLab</text>
  </g>
  <rect x="690" y="304" width="420" height="34" rx="8" fill="#2b2f36"/>
  <text x="708" y="326" class="mono" font-size="15" fill="#9aa5b1">~/.zshrc</text>
  <text x="800" y="326" class="mono" font-size="15" fill="#f1ebdf">eval "$(direnv hook zsh)"</text>

  <!-- Connector -->
  <line x1="322" y1="362" x2="322" y2="414" stroke="#0f5e55" stroke-width="2" marker-end="url(#teal-arrow)"/>
  <line x1="878" y1="362" x2="878" y2="414" stroke="#0f5e55" stroke-width="2" marker-end="url(#teal-arrow)"/>
  <text x="600" y="395" class="sans" font-size="16" font-style="italic" fill="#0f5e55" text-anchor="middle">cd into a folder, and direnv runs its .envrc</text>

  <!-- Layer 2: project cards -->
  <g>
    <rect x="60" y="420" width="525" height="290" rx="14" fill="#fbf8f2" stroke="#0f5e55" stroke-width="2"/>
    <text x="557" y="452" class="eyebrow" fill="#0f5e55" text-anchor="end">PER PROJECT</text>
    <text x="88" y="458" class="mono" font-size="22" font-weight="700" fill="#0f5e55">new-data-project/</text>
    <g font-size="16">
      <text x="88" y="502" class="mono ink">.venv/</text>         <text x="250" y="502" class="sans muted">its own Python and packages</text>
      <text x="88" y="536" class="mono ink">pyproject.toml</text> <text x="250" y="536" class="sans muted">what it depends on</text>
      <text x="88" y="570" class="mono ink">poetry.lock</text>    <text x="250" y="570" class="sans muted">the exact versions installed</text>
      <text x="88" y="604" class="mono ink">.envrc</text>         <text x="250" y="604" class="sans muted">what to do when you cd in</text>
      <text x="88" y="638" class="mono ink">.env</text>           <text x="250" y="638" class="sans muted">secrets, never committed</text>
    </g>
    <line x1="88" y1="660" x2="557" y2="660" stroke="#e2d9c9" stroke-width="1.5"/>
    <rect x="88"  y="672" width="130" height="26" rx="7" fill="#dcebe7"/>
    <text x="153" y="690" class="mono" font-size="14" fill="#0f5e55" text-anchor="middle">pandas 3.0.6</text>
    <rect x="230" y="672" width="300" height="26" rx="7" fill="#dcebe7"/>
    <text x="380" y="690" class="sans" font-size="14" fill="#0f5e55" text-anchor="middle">Jupyter kernel → .venv/bin/python</text>
  </g>

  <g>
    <rect x="615" y="420" width="525" height="290" rx="14" fill="#fbf8f2" stroke="#0f5e55" stroke-width="2"/>
    <text x="1112" y="452" class="eyebrow" fill="#0f5e55" text-anchor="end">PER PROJECT</text>
    <text x="643" y="458" class="mono" font-size="22" font-weight="700" fill="#0f5e55">another-project/</text>
    <g font-size="16">
      <text x="643" y="502" class="mono ink">.venv/</text>         <text x="805" y="502" class="sans muted">its own Python and packages</text>
      <text x="643" y="536" class="mono ink">pyproject.toml</text> <text x="805" y="536" class="sans muted">what it depends on</text>
      <text x="643" y="570" class="mono ink">poetry.lock</text>    <text x="805" y="570" class="sans muted">the exact versions installed</text>
      <text x="643" y="604" class="mono ink">.envrc</text>         <text x="805" y="604" class="sans muted">what to do when you cd in</text>
      <text x="643" y="638" class="mono ink">.env</text>           <text x="805" y="638" class="sans muted">secrets, never committed</text>
    </g>
    <line x1="643" y1="660" x2="1112" y2="660" stroke="#e2d9c9" stroke-width="1.5"/>
    <rect x="643" y="672" width="130" height="26" rx="7" fill="#dcebe7"/>
    <text x="708" y="690" class="mono" font-size="14" fill="#0f5e55" text-anchor="middle">pandas 2.2.3</text>
    <rect x="785" y="672" width="300" height="26" rx="7" fill="#dcebe7"/>
    <text x="935" y="690" class="sans" font-size="14" fill="#0f5e55" text-anchor="middle">Jupyter kernel → .venv/bin/python</text>
  </g>

  <!-- Your shell, moving between folders -->
  <text x="60" y="752" class="eyebrow" fill="#b9411f">YOUR SHELL, MOVING BETWEEN FOLDERS</text>
  <g>
    <rect x="60" y="766" width="240" height="58" rx="12" fill="#ffffff" stroke="#a2988b" stroke-width="1.5"/>
    <text x="80" y="791" class="mono" font-size="16" font-weight="700" fill="#5f554a">~/projects</text>
    <text x="80" y="812" class="sans muted" font-size="14">global python3</text>

    <rect x="480" y="766" width="240" height="58" rx="12" fill="#ffffff" stroke="#0f5e55" stroke-width="1.5"/>
    <text x="500" y="791" class="mono" font-size="16" font-weight="700" fill="#0f5e55">new-data-project</text>
    <text x="500" y="812" class="sans muted" font-size="14">its .venv and .env</text>

    <rect x="900" y="766" width="240" height="58" rx="12" fill="#ffffff" stroke="#0f5e55" stroke-width="1.5"/>
    <text x="920" y="791" class="mono" font-size="16" font-weight="700" fill="#0f5e55">another-project</text>
    <text x="920" y="812" class="sans muted" font-size="14">its own .venv and .env</text>

    <line x1="308" y1="802" x2="472" y2="802" stroke="#b9411f" stroke-width="2" marker-end="url(#coral-arrow)"/>
    <text x="390" y="790" class="mono" font-size="12.5" fill="#b9411f" text-anchor="middle">cd new-data-project</text>
    <line x1="728" y1="802" x2="892" y2="802" stroke="#b9411f" stroke-width="2" marker-end="url(#coral-arrow)"/>
    <text x="810" y="790" class="mono" font-size="12.5" fill="#b9411f" text-anchor="middle">cd ../another-project</text>
  </g>

  <!-- Footer -->
  <line x1="60" y1="852" x2="1140" y2="852" stroke="#e2d9c9" stroke-width="1.5"/>
  <text x="60" y="892" class="serif" font-size="26" font-style="italic" fill="#1f2933">cd in, and the right environment is already there.</text>
  <text x="1140" y="892" class="sans muted" font-size="18" text-anchor="end">barbhs.com</text>
</svg>
